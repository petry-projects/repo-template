# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/ci.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#1-ci-pipeline-ciyml
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. It is a CUSTOMIZE-PER-STACK stub: it passes out of the box so a fresh repo
#      is green on day 0. Replace the placeholder steps with your stack's
#      lint / format / typecheck / unit-test / coverage steps (see the standard).
#   3. The job name `build-and-test` is the required CI status check. Keep it — or,
#      if you split into per-language jobs (e.g. TypeScript, Go, Python), update the
#      repo's branch-protection required checks to match the new job names.
#   4. Two more jobs ship by default and are org required checks — `Secret scan
#      (gitleaks)` (per push-protection.md; needs a .gitleaks.toml at root, seeded
#      by repo-template tooling) and `coverage`.
#      Keep their job names stable so the required checks stay satisfied.
#
# RUNNER-RELIABILITY INVARIANTS (regression-guarded by tests/ci-*.bats):
#   • #152 stale apt index / kcov: every apt job runs `apt-get update` before
#     `apt-get install`, and NO job installs the uninstallable `kcov` package.
#   • #155 transient apt failure: each apt install runs inside a bounded 3-attempt
#     retry loop with a backoff and a post-loop `command -v` failure gate.
#   • #163 gitleaks fetch: the gitleaks download is a bounded 3-attempt curl retry
#     loop with a backoff and a post-loop presence check.
#   • #169 stalled run: every runner job declares a bounded `timeout-minutes`.
#   • #196 per-attempt network stall: each apt command is wrapped in `timeout`,
#     and the gitleaks curl caps `--connect-timeout` + `--max-time`.
#   • #201 fast-fail: concurrency is keyed by github.ref (NOT github.sha) so a new
#     push to a ref cancels the stale in-flight run.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (CI needs contents: read)
#   • triggers: push + pull_request to main
#   • concurrency keyed by ref so a new push cancels the stale run
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── Replace the steps below with your stack's checks ──────────────────────
      # Standard CI stages: lint, format check, type check, unit tests, coverage
      # (plus integration / e2e / build where applicable). For example, a Node repo:
      #   - uses: actions/setup-node@<sha> # vX   (with node-version + cache)
      #   - run: npm ci
      #   - run: npm run lint && npm run typecheck && npm test
      # See BOOTSTRAP.md and the CI standard. The default stack runs the repo's
      # bats compliance suite; the package fetch below is hardened per #152/#155/#196.
      - name: Install test tooling (bats) with bounded retry
        run: |
          for attempt in 1 2 3; do
            timeout 300 sudo apt-get update -qq && \
            timeout 300 sudo apt-get install -y -qq bats && break
            [ "$attempt" -lt 3 ] && sleep 5
          done
          command -v bats >/dev/null 2>&1 || { echo "bats install failed after 3 attempts" >&2; exit 1; }

      - name: Run bats test suite
        run: |
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found."
            exit 0
          fi
          bats "${bats_files[@]}"

  # Canonical secret-scan job — copied verbatim from push-protection.md#required-ci-job.
  # Produces the `Secret scan (gitleaks)` required check. Uses the gitleaks CLI (not
  # gitleaks/gitleaks-action, whose v2+ needs a paid org license); fully pinned +
  # checksum-verified; no SARIF upload, so no `security-events: write` permission.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (bounded retry)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Named GITLEAKS_CHECKSUM (not GITLEAKS_SHA256) — SonarCloud flags env var names
          # matching *SHA256* containing hex strings as Security Hotspots (false positive).
          GITLEAKS_CHECKSUM: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # Bounded retry (#163) with per-attempt network caps (#196). --proto-redir
          # '=https' (S6506) keeps a redirect from downgrading the fetch to http://.
          for attempt in 1 2 3; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --connect-timeout 15 --max-time 120 "${url}" -o /tmp/gitleaks.tar.gz && break
            [ "$attempt" -lt 3 ] && sleep 5
          done
          test -s /tmp/gitleaks.tar.gz || { echo "gitleaks download failed after 3 attempts" >&2; exit 1; }
          echo "${GITLEAKS_CHECKSUM}  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin

      - name: Run gitleaks
        # Requires a .gitleaks.toml at repo root (seeded by seed-repo-template.sh).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # Stack-aware coverage — produces the `coverage` required check. Default stack is
  # shell/bats. #152 removed the uninstallable `kcov` apt package: coverage installs
  # bats via apt (hardened retry) and runs the suite. Add real coverage instrumentation
  # per your stack below (keep the job id and `name:` as `coverage` so the required
  # check stays stable).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test tooling (bats) with bounded retry
        run: |
          for attempt in 1 2 3; do
            timeout 300 sudo apt-get update -qq && \
            timeout 300 sudo apt-get install -y -qq bats && break
            [ "$attempt" -lt 3 ] && sleep 5
          done
          command -v bats >/dev/null 2>&1 || { echo "bats install failed after 3 attempts" >&2; exit 1; }

      - name: Coverage (shell/bats)
        run: |
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found — coverage is green until tests exist."
            exit 0
          fi
          bats "${bats_files[@]}"
          echo "bats suite passed."

      # ── Per-stack expansion — replace/augment the shell block above for your stack.
      #    Keep the job id and `name:` as `coverage` so the required check is unchanged.
      #    Node:   npx jest --coverage
      #    Go:     go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out
      #    Python: pytest --cov
      #    Rust:   cargo llvm-cov --workspace
