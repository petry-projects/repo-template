# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/ci.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#1-ci-pipeline-ciyml
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. It is a CUSTOMIZE-PER-STACK stub: it passes out of the box so a fresh repo
#      is green on day 0. Replace the placeholder step with your stack's
#      lint / format / typecheck / unit-test / coverage steps (see the standard).
#   3. The job name `build-and-test` is the required CI status check. Keep it — or,
#      if you split into per-language jobs (e.g. TypeScript, Go, Python), update the
#      repo's branch-protection required checks to match the new job names.
#   4. Two more jobs ship by default and are org required checks — `Secret scan
#      (gitleaks)` (per push-protection.md; needs a .gitleaks.toml at root, seeded
#      by repo-template tooling) and `coverage` (green until your stack emits coverage).
#      Keep their job names stable so the required checks stay satisfied.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (CI needs contents: read)
#   • triggers: push + pull_request to main
#   • concurrency keyed by ref+sha so a new push cancels the stale run
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # Bound the job so a stalled network op (apt/checkout wedged on a bad mirror
    # or DNS) fails fast instead of hanging for GitHub's 360-minute default — the
    # p95=404s tail behind issue #169. Normal runs finish in ~20s; 10m is ample
    # headroom while still catching a hang far below the default budget.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Replace the step below with your stack's checks ───────────────────────
      # Standard CI stages: lint, format check, type check, unit tests, coverage
      # (plus integration / e2e / build where applicable). For example, a Node repo:
      #   - uses: actions/setup-node@<sha> # vX   (with node-version + cache)
      #   - run: npm ci
      #   - run: npm run lint && npm run typecheck && npm test
      # See BOOTSTRAP.md and the CI standard. Until you add real steps, the
      # placeholder below keeps the required `build-and-test` check green.
      - name: Placeholder — replace with real build/test steps
        run: echo "CI stub — add your stack's lint/format/typecheck/test/coverage steps; see BOOTSTRAP.md."


      - name: Install bats
        # Refresh the package index first — installing against the runner image's
        # stale cached index fails intermittently ("Unable to locate package") — then
        # retry the whole update+install so a *transient* apt/network failure
        # (temporary DNS failure, hash-sum mismatch, a briefly-unavailable mirror)
        # is retried instead of hard-failing the run on the first attempt.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq bats python3-yaml \
              && break
            echo "::warning::apt install of bats failed (attempt ${attempt}/3); retrying in 5s" >&2
            sleep 5
          done
          # Fail loudly if every attempt was exhausted, rather than silently
          # continuing to the test step with bats missing.
          command -v bats >/dev/null || { echo "::error::bats install failed after 3 attempts" >&2; exit 1; }

      - name: Run compliance regression tests
        run: bats tests/ci-secret-scan.bats tests/ci-runner-setup.bats tests/ci-apt-retry.bats tests/ci-job-timeout.bats tests/dev-lead-stub.bats tests/code-quality-ruleset.bats tests/pr-quality-ruleset.bats


  # Canonical secret-scan job — copied verbatim from push-protection.md#required-ci-job.
  # Produces the `Secret scan (gitleaks)` required check. Uses the gitleaks CLI (not
  # gitleaks/gitleaks-action, whose v2+ needs a paid org license); fully pinned +
  # checksum-verified; no SARIF upload, so no `security-events: write` permission.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Bound the job so a stalled gitleaks download / checkout fails fast instead
    # of hanging for the 360-minute default (issue #169). See build-and-test.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Named GITLEAKS_CHECKSUM (not GITLEAKS_SHA256) — SonarCloud flags env var names
          # matching *SHA256* containing hex strings as Security Hotspots (false positive).
          GITLEAKS_CHECKSUM: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          verified=false
          for attempt in 1 2 3; do
            curl -fsSL --proto '=https' --proto-redir '=https' "${url}" -o /tmp/gitleaks.tar.gz \
              && echo "${GITLEAKS_CHECKSUM}  /tmp/gitleaks.tar.gz" | sha256sum -c \
              && { verified=true; break; }
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::gitleaks download failed (attempt ${attempt}/3); retrying in 5s" >&2
              sleep 5
            fi
          done
          [ "$verified" = true ] || { echo "::error::gitleaks download or checksum verification failed after 3 attempts" >&2; exit 1; }
          # Post-loop existence gate: the retry loop only sets verified=true after a
          # passing checksum, so a present tarball here is also a verified one.
          test -s /tmp/gitleaks.tar.gz || { echo "::error::gitleaks tarball missing after verified download" >&2; exit 1; }
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin

      - name: Run gitleaks
        # Requires a .gitleaks.toml at repo root (seeded by seed-repo-template.sh).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # Stack-aware coverage — produces the `coverage` required check. Default stack is
  # shell/bats via kcov. GREEN-UNTIL-TESTS: when a stack emits no coverage yet, the
  # job succeeds without producing a report, so seeding it fleet-wide never bricks a
  # repo that has no test suite. It begins enforcing once tests exist. Add a per-stack
  # block below (keep the job id and `name:` as `coverage` so the required check is stable).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Bound the job so a stalled apt/checkout fails fast instead of hanging for
    # the 360-minute default (issue #169). See build-and-test.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Coverage (shell/bats via kcov)
        run: |
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found — coverage is green until tests exist."
            exit 0
          fi
          for attempt in 1 2 3; do
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq bats python3-yaml build-essential cmake git pkg-config libcurl4-openssl-dev \
              && break
            echo "::warning::apt install failed (attempt ${attempt}/3); retrying in 5s" >&2
            sleep 5
          done
          command -v bats >/dev/null || { echo "::error::bats install failed after 3 attempts" >&2; exit 1; }
          # Install kcov from source (not available in Ubuntu 24.04 standard repos)
          KCOV_VERSION="43"
          if [ ! -f /usr/local/bin/kcov ]; then
            original_dir="$(pwd)"
            mkdir -p /tmp/kcov-build
            cd /tmp
            for attempt in 1 2 3; do
              curl -fsSL --proto '=https' "https://github.com/SimonKagstrom/kcov/archive/v${KCOV_VERSION}.tar.gz" -o kcov.tar.gz && break
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::kcov download failed (attempt ${attempt}/3); retrying in 5s" >&2
                sleep 5
              fi
            done
            test -s kcov.tar.gz || { echo "::warning::kcov download failed after 3 attempts; will run bats without coverage" >&2; }
            if [ -s kcov.tar.gz ]; then
              tar -xzf kcov.tar.gz -C /tmp/kcov-build --strip-components=1 \
                && cd /tmp/kcov-build \
                && mkdir -p build \
                && cd build \
                && cmake .. >/dev/null 2>&1 \
                && make >/dev/null 2>&1 \
                && sudo make install >/dev/null 2>&1 \
                || echo "::warning::kcov build failed; will run bats without coverage" >&2
            fi
            cd "$original_dir"
          fi
          mkdir -p coverage
          if command -v kcov >/dev/null; then
            kcov --include-path=. --exclude-path=tests,coverage coverage bats "${bats_files[@]}"
            echo "Coverage report written to ./coverage"
          else
            echo "::warning::kcov not available; running bats without coverage" >&2
            bats "${bats_files[@]}"
          fi

      # ── Per-stack expansion — replace/augment the shell block above for your stack.
      #    Keep the job id and `name:` as `coverage` so the required check is unchanged.
      #    Node:   npx jest --coverage
      #    Go:     go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out
      #    Python: pytest --cov
      #    Rust:   cargo llvm-cov --workspace