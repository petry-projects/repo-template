# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/ci.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#1-ci-pipeline-ciyml
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. It is a CUSTOMIZE-PER-STACK stub: it passes out of the box so a fresh repo
#      is green on day 0. Replace the placeholder step with your stack's
#      lint / format / typecheck / unit-test / coverage steps (see the standard).
#   3. The job name `build-and-test` is the required CI status check. Keep it — or,
#      if you split into per-language jobs (e.g. TypeScript, Go, Python), update the
#      repo's branch-protection required checks to match the new job names.
#   4. Two more jobs ship by default and are org required checks — `Secret scan
#      (gitleaks)` (per push-protection.md; needs a .gitleaks.toml at root, seeded
#      by repo-template tooling) and `coverage` (green until your stack emits coverage).
#      Keep their job names stable so the required checks stay satisfied.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (CI needs contents: read)
#   • triggers: push + pull_request to main
#   • concurrency keyed by ref+sha so a new push cancels the stale run
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── Replace/augment the steps below with your stack's checks ──────────────
      # Standard CI stages: lint, format check, type check, unit tests, coverage
      # (plus integration / e2e / build where applicable). For example, a Node repo:
      #   - uses: actions/setup-node@<sha> # vX   (with node-version + cache)
      #   - run: npm ci
      #   - run: npm run lint && npm run typecheck && npm test
      # See BOOTSTRAP.md and the CI standard. The default stack is shell/bats: the
      # step below installs bats (with a bounded, backed-off apt retry so a
      # transient mirror/DNS blip does not hard-fail the run — issues #152/#155)
      # and runs the repo's test suite.
      - name: Install bats and run tests
        run: |
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found — nothing to run."
            exit 0
          fi
          for attempt in 1 2 3; do
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq bats \
              && break
            if [ "$attempt" -lt 3 ]; then
              echo "apt install failed (attempt ${attempt}/3) — retrying after backoff…"
              sleep 5
            fi
          done
          command -v bats >/dev/null 2>&1 || { echo "bats install failed after 3 attempts"; exit 1; }
          bats "${bats_files[@]}"

  # Canonical secret-scan job — copied verbatim from push-protection.md#required-ci-job.
  # Produces the `Secret scan (gitleaks)` required check. Uses the gitleaks CLI (not
  # gitleaks/gitleaks-action, whose v2+ needs a paid org license); fully pinned +
  # checksum-verified; no SARIF upload, so no `security-events: write` permission.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Named GITLEAKS_CHECKSUM (not GITLEAKS_SHA256) — SonarCloud flags env var names
          # matching *SHA256* containing hex strings as Security Hotspots (false positive).
          GITLEAKS_CHECKSUM: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # Bounded, backed-off download retry (issue #163) so a transient network
          # blip does not hard-fail the required check. --proto-redir '=https'
          # (githubactions:S6506) forbids a redirect from downgrading to http://.
          for attempt in 1 2 3; do
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "${url}" -o /tmp/gitleaks.tar.gz && break
            if [ "$attempt" -lt 3 ]; then
              echo "gitleaks download failed (attempt ${attempt}/3) — retrying after backoff…"
              sleep 5
            fi
          done
          [ -s /tmp/gitleaks.tar.gz ] || { echo "gitleaks download failed after 3 attempts"; exit 1; }
          echo "${GITLEAKS_CHECKSUM}  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin

      - name: Run gitleaks
        # Requires a .gitleaks.toml at repo root (seeded by seed-repo-template.sh).
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # Stack-aware coverage — produces the `coverage` required check. Default stack is
  # shell/bats. GREEN-UNTIL-TESTS: when a stack emits no tests yet, the job succeeds
  # without running anything, so seeding it fleet-wide never bricks a repo that has
  # no test suite. It begins enforcing once tests exist. Add a per-stack block below
  # (keep the job id and `name:` as `coverage` so the required check is stable).
  #
  # NOTE: kcov is intentionally NOT installed here — it is absent from the Ubuntu
  # runner's apt repositories, so `apt-get install kcov` fails with "Unable to
  # locate package kcov" and dies the whole job (issue #152). The default coverage
  # gate simply runs the bats suite; swap in a real coverage tool per stack below.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This job checks out the PR ref and runs tests/**/*.bats on
          # pull_request. Don't persist GITHUB_TOKEN in .git/config — a modified
          # test could otherwise read it (artipacked / CWE-522). Coverage needs
          # no authenticated git operations.
          persist-credentials: false

      - name: Coverage (shell/bats)
        run: |
          shopt -s globstar nullglob
          bats_files=(tests/**/*.bats)
          if [ ${#bats_files[@]} -eq 0 ]; then
            echo "No bats tests found — coverage is green until tests exist."
            exit 0
          fi
          # Bounded, backed-off apt retry (issues #152/#155): update precedes
          # install so a stale index can't hard-fail, and a transient blip is
          # retried instead of dying on the first attempt.
          for attempt in 1 2 3; do
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq bats \
              && break
            if [ "$attempt" -lt 3 ]; then
              echo "apt install failed (attempt ${attempt}/3) — retrying after backoff…"
              sleep 5
            fi
          done
          command -v bats >/dev/null 2>&1 || { echo "bats install failed after 3 attempts"; exit 1; }
          bats "${bats_files[@]}"

      # ── Per-stack expansion — replace/augment the shell block above for your stack.
      #    Keep the job id and `name:` as `coverage` so the required check is unchanged.
      #    Node:   npx jest --coverage
      #    Go:     go test ./... -coverprofile=coverage.out && go tool cover -func=coverage.out
      #    Python: pytest --cov
      #    Rust:   cargo llvm-cov --workspace