# Dependabot configuration for frontend (npm) repositories
# Copy to .github/dependabot.yml and adjust directory paths as needed
#
# npm uses open-pull-requests-limit: 0 to suppress version update PRs.
# Dependabot security updates bypass this limit, so security PRs still open.
version: 2
updates:
  # npm — security updates only (limit 0 suppresses version updates)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "security"
      - "dependencies"
  # github-actions — version updates weekly. Unlike application ecosystems,
  # actions use version updates (limit 10, not 0): pinned action SHAs do not
  # affect application runtime, and the auto-merge workflow approves SHA-pinned
  # bumps while CI catches breaking interface changes. See
  # standards/dependabot-policy.md#github-actions-all-repos.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"